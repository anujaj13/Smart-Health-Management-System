name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT }}
  REGION: asia-south1
  SERVICE_NAME: healthlink
  IMAGE_NAME: asia-south1.pkg.dev/${{ secrets.GCP_PROJECT }}/healthlink/healthlink

jobs:
  build-and-deploy:
    name: Build and Deploy API to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    outputs:
      service_url: ${{ steps.get-url.outputs.SERVICE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      # FIX: Authenticate specifically for Artifact Registry region
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker
          
      # FIX: Changed us-central1 to use env.REGION
      - name: Create Artifact Registry repository if needed
        run: |
          gcloud artifacts repositories create healthlink \
            --repository-format=docker \
            --location=${{ env.REGION }} \
            --quiet || true

      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} -f Dockerfile.api .
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.IMAGE_NAME }}:latest

      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest 

      # FIX: Cleared up --set-secrets syntax, added missing config envs
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --memory 2Gi \
            --cpu 2 \
            --timeout 300 \
            --max-instances 10 \
            --min-instances 0 \
            --set-env-vars "LOG_LEVEL=INFO,GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},PINECONE_API_KEY=${{ secrets.PINECONE_API_KEY }},LLM_MODEL_NAME=gemini-1.5-pro,PINECONE_INDEX_NAME=healthlink,RAG_TOP_K=5,CHUNK_SIZE=500,CHUNK_OVERLAP=50,DATABASE_URL=sqlite:///./data/healthlink.db"

      # FIX: Map output variable so the frontend job can access it
      - name: Get service URL
        id: get-url
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --format 'value(status.url)')
          echo "Service deployed to: $SERVICE_URL"
          echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_OUTPUT
          echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_ENV

      - name: Run health check
        run: |
          sleep 15
          curl -f ${{ env.SERVICE_URL }}/api/v1/health || exit 1
          echo "Health check passed!"

  build-and-deploy-ui:
    name: Build and Deploy Frontend (Streamlit) to Cloud Run
    runs-on: ubuntu-latest
    needs: build-and-deploy 
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}.pkg.dev

      - name: Build Docker image for UI
        run: |
          docker build -t ${{ env.IMAGE_NAME }}-ui:${{ github.sha }} -f Dockerfile.frontend .
          docker tag ${{ env.IMAGE_NAME }}-ui:${{ github.sha }} ${{ env.IMAGE_NAME }}-ui:latest

      - name: Push Docker image to GCR
        run: |
          docker push ${{ env.IMAGE_NAME }}-ui:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}-ui:latest

      # FIX: Added --set-env-vars to link Streamlit to the backend Cloud Run URL
      - name: Deploy UI to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }}-ui \
            --image ${{ env.IMAGE_NAME }}-ui:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --memory 2Gi \
            --cpu 2 \
            --timeout 300 \
            --max-instances 10 \
            --min-instances 0 \
            --set-env-vars "API_BASE_URL=${{ needs.build-and-deploy.outputs.service_url }}/api/v1"

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [build-and-deploy, build-and-deploy-ui]
    if: always()
    steps:
      - name: Deployment Success
        if: needs.build-and-deploy.result == 'success' && needs.build-and-deploy-ui.result == 'success'
        run: |
          echo "Deployment successful!"
          echo "HealthLink is now live on Google Cloud Run"

      - name: Deployment Failed
        if: needs.build-and-deploy.result == 'failure' || needs.build-and-deploy-ui.result == 'failure'
        run: |
          echo "Deployment failed!"
          echo "Please check the logs above for errors"
          exit 1